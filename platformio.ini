; PlatformIO Configuration for MEGA_EPIC_CANBUS
; Arduino Mega2560 + MCP2515 CAN Shield

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-1130

; Library Dependencies
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git

; Upload
upload_port = /dev/cu.usbserial-1130
